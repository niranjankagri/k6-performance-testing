# Keeps dependencies and CI actions current (security alerts are on separately). Once a month,
# minor and patch updates are grouped into one pull request per ecosystem and folder; a major
# version comes as its own pull request and is reviewed before merging. CI checks every update.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions-minor-patch:
        update-types: [minor, patch]
